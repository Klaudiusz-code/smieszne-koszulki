query CheckoutAttempt($requestId: String!) {
  storeCheckoutStatus(requestId: $requestId) {
    status
    message
    orderId
    orderKey
    needsPayment
    redirectUrl
  }
}

mutation PlaceOrder($input: StoreCheckoutInput!) {
  storeCheckout(input: $input) {
    status
    message
    orderId
    orderKey
    needsPayment
    redirectUrl
  }
}
