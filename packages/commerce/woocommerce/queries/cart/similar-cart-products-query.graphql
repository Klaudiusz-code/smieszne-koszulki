query SimilarCartProducts($categoryId: Int!) {
  products(
    first: 8
    where: {
      orderby: { field: DATE, order: DESC }
      categoryId: $categoryId
      status: "publish"
      visibility: VISIBLE
    }
  ) {
    nodes {
      __typename
      id
      databaseId
      slug
      name
      image {
        sourceUrl(size: WOOCOMMERCE_THUMBNAIL)
        altText
      }
      ... on SimpleProduct {
        price
        regularPrice
        salePrice
        onSale
        stockStatus
        stockQuantity
      }
      ... on VariableProduct {
        price
        regularPrice
        salePrice
        onSale
        stockStatus
        stockQuantity
      }
      productCategories {
        nodes {
          slug
        }
      }
    }
  }
}
